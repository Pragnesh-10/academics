<html>
    <body>
        
        <input type="text" placeholder="Enter your name", width="200px", height="30px"><br>
        <input type="email" placeholder="Enter your email", width="200px", height="30px"><br>
        <input type = "password" placeholder="Enter your password", width="200px", height="30px"><br>
        <input type="password" placeholder="Confirm your password", width="200px", height="30px"><br>
        <input type="radiobutton" name="gender" value="male">Male<br>
        <input type="radiobutton" name="gender" value="female">Female<br>
        <input type="checkbox"> I agree to the terms and conditions<br>

        <button>Submit</button>
        <script>
        
        const input = document.querySelector('input');
        if (input.value === '') {
            alert('Please fill in all fields');
        } else {
            alert('Form submitted successfully');
        }
        const password = document.querySelector('input[type="password"]');
        const confirmPassword = document.querySelector('input[placeholder="Confirm your password"]');
        if (password.value !== confirmPassword.value) {
            alert('Passwords do not match');
        }
        </script>
    </body>
</html>
